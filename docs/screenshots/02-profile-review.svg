<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" fill="#f5f5f4" rx="16"/>

  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Browser Window Chrome -->
    <rect width="920" height="580" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 908 0 C 914.627 0 920 5.373 920 12 L 920 44 L 0 44 Z" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>
    <rect x="220" y="10" width="480" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="460" y="26" text-anchor="middle" class="sans" font-size="11" fill="#78716c">https://brewwise.app/profile/subko-project-sankalp</text>

    <!-- Header Section -->
    <g transform="translate(48, 64)">
      <text x="0" y="14" class="sans" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.8">STEP 2 OF 3 · EXTRACTION REVIEW</text>
      <text x="0" y="38" class="serif" font-size="22" font-weight="700" fill="#1c1917">Review Extracted Coffee Profile</text>
      <text x="0" y="56" class="sans" font-size="12" fill="#78716c">Confirm verified bag metadata with confidence flags before dial-in recipe generation.</text>
    </g>

    <!-- Profile Grid Card -->
    <g transform="translate(48, 140)">
      <rect width="824" height="236" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>

      <!-- Row 1: Roaster, Name, Origin -->
      <g transform="translate(20, 18)">
        <!-- Field 1 -->
        <g transform="translate(0, 0)">
          <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">ROASTER / BRAND</text>
          <rect x="180" y="-2" width="64" height="16" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="212" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#059669">✓ 98% Bag</text>
          <rect x="0" y="18" width="246" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#1c1917">Subko Specialty Coffee Co.</text>
        </g>
        <!-- Field 2 -->
        <g transform="translate(270, 0)">
          <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">PRODUCT / LOT NAME</text>
          <rect x="180" y="-2" width="64" height="16" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="212" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#059669">✓ 95% Bag</text>
          <rect x="0" y="18" width="246" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#1c1917">Project Sankalp Lot 42</text>
        </g>
        <!-- Field 3 -->
        <g transform="translate(540, 0)">
          <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">ORIGIN COUNTRY</text>
          <rect x="180" y="-2" width="64" height="16" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="212" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#059669">✓ 99% Bag</text>
          <rect x="0" y="18" width="244" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#1c1917">India (Ratnagiri Estate)</text>
        </g>
      </g>

      <!-- Row 2: Process, Roast Level, Varietal -->
      <g transform="translate(20, 84)">
        <g transform="translate(0, 0)">
          <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">PROCESS METHOD</text>
          <rect x="180" y="-2" width="64" height="16" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="212" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#059669">✓ 94% Bag</text>
          <rect x="0" y="18" width="246" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#1c1917">Anaerobic Natural</text>
        </g>
        <g transform="translate(270, 0)">
          <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">ROAST LEVEL</text>
          <rect x="180" y="-2" width="64" height="16" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
          <text x="212" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#059669">✓ 92% Bag</text>
          <rect x="0" y="18" width="246" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#1c1917">Light-Medium Roast</text>
        </g>
        <g transform="translate(540, 0)">
          <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">VARIETAL</text>
          <rect x="180" y="-2" width="64" height="16" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
          <text x="212" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#b45309">~ 85% Bag</text>
          <rect x="0" y="18" width="244" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#1c1917">Catuai, Selection 795</text>
        </g>
      </g>

      <!-- Row 3: Tasting Notes -->
      <g transform="translate(20, 150)">
        <text x="0" y="10" class="sans" font-size="10" font-weight="700" fill="#78716c">TASTING NOTES (EXTRACTED)</text>
        <rect x="720" y="-2" width="64" height="16" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="752" y="10" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#059669">✓ 91% Bag</text>
        <rect x="0" y="18" width="784" height="34" rx="6" fill="#fafafa" stroke="#d6d3d1" stroke-width="1"/>
        <text x="10" y="40" class="sans" font-size="12" font-weight="600" fill="#d97706">Passion Fruit, Wild Guava, Hibiscus Florals, Honeycomb</text>
      </g>
    </g>

    <!-- Equipment Calibration Setup Card -->
    <g transform="translate(48, 394)">
      <rect width="824" height="114" rx="10" fill="#fcfbfa" stroke="#e7e5e4" stroke-width="1"/>
      <text x="20" y="24" class="sans" font-size="12" font-weight="700" fill="#1c1917">⚙️ Brewing Setup &amp; Preferences</text>

      <g transform="translate(20, 38)">
        <g transform="translate(0, 0)">
          <text x="0" y="12" class="sans" font-size="10" font-weight="700" fill="#78716c">POUR-OVER DRIPPER</text>
          <rect x="0" y="18" width="180" height="32" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="38" class="sans" font-size="12" fill="#1c1917">Hario V60 (02)</text>
        </g>

        <g transform="translate(200, 0)">
          <text x="0" y="12" class="sans" font-size="10" font-weight="700" fill="#78716c">GRINDER (25 PRESETS)</text>
          <rect x="0" y="18" width="200" height="32" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="38" class="sans" font-size="12" fill="#1c1917">Comandante C40 MK4</text>
        </g>

        <g transform="translate(420, 0)">
          <text x="0" y="12" class="sans" font-size="10" font-weight="700" fill="#78716c">DOSE (GRAMS)</text>
          <rect x="0" y="18" width="160" height="32" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="38" class="sans" font-size="12" font-weight="700" fill="#1c1917">15.0 g</text>
        </g>

        <g transform="translate(600, 0)">
          <text x="0" y="12" class="sans" font-size="10" font-weight="700" fill="#78716c">TARGET PROFILE</text>
          <rect x="0" y="18" width="184" height="32" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
          <text x="10" y="38" class="sans" font-size="12" fill="#1c1917">Balanced &amp; Sweet (1:16)</text>
        </g>
      </g>
    </g>

    <!-- Bottom Action CTA -->
    <g transform="translate(350, 522)">
      <rect width="220" height="40" rx="8" fill="#3c5438"/>
      <text x="110" y="25" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#ffffff">Generate Dialed-In Recipe ✨</text>
    </g>
  </g>
</svg>

