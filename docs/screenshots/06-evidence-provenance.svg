<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="640" fill="#f5f5f4" rx="16"/>

  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Browser Window Chrome -->
    <rect width="920" height="580" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 908 0 C 914.627 0 920 5.373 920 12 L 920 44 L 0 44 Z" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>
    <rect x="220" y="10" width="480" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="460" y="26" text-anchor="middle" class="sans" font-size="11" fill="#78716c">https://brewwise.app/evidence/provenance-explorer</text>

    <!-- Header Section -->
    <g transform="translate(48, 64)">
      <text x="0" y="14" class="sans" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.8">RAG GROUNDING &amp; PROVENANCE</text>
      <text x="0" y="38" class="serif" font-size="22" font-weight="700" fill="#1c1917">Retrieved Evidence &amp; Zero-Fabrication Audit</text>
      <text x="0" y="56" class="sans" font-size="12" fill="#78716c">Every recommended parameter is traced back to real roaster brew guides or brewing physics.</text>
    </g>

    <!-- Discovery & Outcome Banner -->
    <g transform="translate(48, 134)">
      <rect width="824" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <text x="0" y="14" class="sans" font-size="12" font-weight="700" fill="#1e40af">
          🌐 Live Web &amp; Curated KB: <tspan font-weight="400" fill="#1e3a8a">Found 3 candidate recipes across Blue Tokai and Subko archives.</tspan>
        </text>
        <rect x="670" y="-3" width="120" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text x="730" y="12" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#1d4ed8">OUTCOME A (EXACT)</text>
      </g>
    </g>

    <!-- Evidence Cards Grid -->
    <g transform="translate(48, 196)">
      <!-- Source 1: Exact Match -->
      <g transform="translate(0, 0)">
        <rect width="824" height="84" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
        <g transform="translate(18, 16)">
          <rect x="0" y="0" width="84" height="18" rx="4" fill="#ecfdf5"/>
          <text x="42" y="13" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#059669">EXACT MATCH</text>
          <text x="96" y="14" class="mono" font-size="10" fill="#78716c">Score: 0.94 · RRF Rank: #1</text>
          <text x="0" y="38" class="sans" font-size="13" font-weight="700" fill="#1c1917">Subko Specialty Coffee — Official Lot 42 Filter Recipe</text>
          <text x="0" y="56" class="sans" font-size="11" fill="#78716c">Dripper: V60 | Ratio: 1:16 | Dose: 15g | Water: 240g | Temp: 93°C | Bloom: 45g (45s)</text>
          <text x="720" y="38" text-anchor="end" class="sans" font-size="11" font-weight="600" fill="#2563eb">subko.coffee ↗</text>
        </g>
      </g>

      <!-- Source 2: Strong Match -->
      <g transform="translate(0, 96)">
        <rect width="824" height="84" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
        <g transform="translate(18, 16)">
          <rect x="0" y="0" width="94" height="18" rx="4" fill="#f0fdf4"/>
          <text x="47" y="13" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#166534">STRONG MATCH</text>
          <text x="106" y="14" class="mono" font-size="10" fill="#78716c">Score: 0.88 · RRF Rank: #2</text>
          <text x="0" y="38" class="sans" font-size="13" font-weight="700" fill="#1c1917">Ratnagiri Estate Specialty Pour-Over Guide — Aramse</text>
          <text x="0" y="56" class="sans" font-size="11" fill="#78716c">Dripper: V60 | Ratio: 1:16.6 | Dose: 15g | Water: 250g | Temp: 92°C | 3-pour method</text>
          <text x="720" y="38" text-anchor="end" class="sans" font-size="11" font-weight="600" fill="#2563eb">aramse.coffee ↗</text>
        </g>
      </g>

      <!-- Source 3: Related Match -->
      <g transform="translate(0, 192)">
        <rect width="824" height="84" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
        <g transform="translate(18, 16)">
          <rect x="0" y="0" width="104" height="18" rx="4" fill="#faf5ff"/>
          <text x="52" y="13" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#7e22ce">RELATED COFFEE</text>
          <text x="116" y="14" class="mono" font-size="10" fill="#78716c">Score: 0.74 · RRF Rank: #3</text>
          <text x="0" y="38" class="sans" font-size="13" font-weight="700" fill="#1c1917">Indian Anaerobic Naturals Extraction Profile — Perfect Daily Grind</text>
          <text x="0" y="56" class="sans" font-size="11" fill="#78716c">Dripper: Flat Bed Kalita | Ratio: 1:15 | Dose: 16g | Water: 240g | Temp: 94°C</text>
          <text x="720" y="38" text-anchor="end" class="sans" font-size="11" font-weight="600" fill="#2563eb">perfectdailygrind.com ↗</text>
        </g>
      </g>
    </g>

    <!-- Barista Conflict Resolution Banner -->
    <g transform="translate(48, 492)">
      <rect width="824" height="54" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
      <g transform="translate(16, 18)">
        <text x="0" y="12" class="sans" font-size="11" font-weight="700" fill="#92400e">
          ⚖️ Automatic Barista Conflict Resolution:
        </text>
        <text x="0" y="28" class="sans" font-size="11" fill="#b45309">
          Source #1 recommended 93°C; Source #3 suggested 94°C. System prioritized Source #1 (Exact Lot Match) to prevent over-extracting delicate floral aromatics.
        </text>
      </g>
    </g>
  </g>
</svg>
