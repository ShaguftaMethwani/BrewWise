<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="640" fill="#f5f5f4" rx="16"/>

  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Browser Window Chrome -->
    <rect width="920" height="580" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 908 0 C 914.627 0 920 5.373 920 12 L 920 44 L 0 44 Z" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>
    <rect x="220" y="10" width="480" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="460" y="26" text-anchor="middle" class="sans" font-size="11" fill="#78716c">https://brewwise.app/recipe/rec-7a8f921e</text>

    <!-- Header Section -->
    <g transform="translate(48, 64)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="90" height="20" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="45" y="14" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#b45309">HARIO V60</text>
        <rect x="98" y="0" width="160" height="20" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="178" y="14" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#059669">✓ EXACT SOURCE MATCH</text>
        <text x="270" y="14" class="sans" font-size="11" fill="#78716c">Comandante C40: 22 clicks</text>
      </g>
      <text x="0" y="46" class="serif" font-size="24" font-weight="700" fill="#1c1917">Precision Dialed-In Recipe</text>
      <text x="0" y="68" class="sans" font-size="12" fill="#d97706">✨ Expected: Juicy tropical acidity, passion fruit sweetness, clean floral finish</text>
    </g>

    <!-- Key Metrics Cards -->
    <g transform="translate(48, 146)">
      <!-- Dose -->
      <g transform="translate(0, 0)">
        <rect width="150" height="66" rx="8" fill="#fafafa" stroke="#e7e5e4" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="10" font-weight="700" fill="#78716c">⚖️ DOSE</text>
        <text x="14" y="50" class="mono" font-size="22" font-weight="700" fill="#1c1917">15.0g</text>
      </g>
      <!-- Water -->
      <g transform="translate(168, 0)">
        <rect width="150" height="66" rx="8" fill="#fafafa" stroke="#e7e5e4" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="10" font-weight="700" fill="#78716c">💧 WATER</text>
        <text x="14" y="50" class="mono" font-size="22" font-weight="700" fill="#1c1917">240g</text>
      </g>
      <!-- Ratio -->
      <g transform="translate(336, 0)">
        <rect width="150" height="66" rx="8" fill="#fafafa" stroke="#e7e5e4" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="10" font-weight="700" fill="#78716c">📊 RATIO</text>
        <text x="14" y="50" class="mono" font-size="22" font-weight="700" fill="#1c1917">1:16.0</text>
      </g>
      <!-- Temp -->
      <g transform="translate(504, 0)">
        <rect width="150" height="66" rx="8" fill="#fafafa" stroke="#e7e5e4" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="10" font-weight="700" fill="#78716c">🌡️ TEMP</text>
        <text x="14" y="50" class="mono" font-size="22" font-weight="700" fill="#1c1917">93°C</text>
      </g>
      <!-- Time -->
      <g transform="translate(672, 0)">
        <rect width="152" height="66" rx="8" fill="#fafafa" stroke="#e7e5e4" stroke-width="1"/>
        <text x="14" y="22" class="sans" font-size="10" font-weight="700" fill="#78716c">⏱️ TARGET</text>
        <text x="14" y="50" class="mono" font-size="22" font-weight="700" fill="#1c1917">3:00</text>
      </g>
    </g>

    <!-- Grind Setting Callout Banner -->
    <g transform="translate(48, 226)">
      <rect width="824" height="34" rx="6" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
      <text x="16" y="22" class="sans" font-size="12" fill="#92400e">
        🧭 <tspan font-weight="700">Grinder Calibration:</tspan> Medium-Fine (table salt consistency) · <tspan font-weight="700" fill="#b45309">Comandante C40: 22 clicks</tspan> (1Zpresso: 2.3.0 · Fellow Ode: 4.1)
      </text>
    </g>

    <!-- Pour Schedule Breakdown Table -->
    <g transform="translate(48, 276)">
      <rect width="824" height="236" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
      <text x="20" y="26" class="sans" font-size="13" font-weight="700" fill="#1c1917">Pour Schedule &amp; Cumulative Water Targets</text>

      <!-- Table Header -->
      <g transform="translate(20, 44)">
        <rect width="784" height="24" rx="4" fill="#fafafa"/>
        <text x="14" y="16" class="sans" font-size="10" font-weight="700" fill="#78716c">STEP</text>
        <text x="70" y="16" class="sans" font-size="10" font-weight="700" fill="#78716c">START TIME</text>
        <text x="170" y="16" class="sans" font-size="10" font-weight="700" fill="#78716c">POUR WEIGHT</text>
        <text x="280" y="16" class="sans" font-size="10" font-weight="700" fill="#78716c">SCALE TARGET</text>
        <text x="400" y="16" class="sans" font-size="10" font-weight="700" fill="#78716c">POURING TECHNIQUE</text>
      </g>

      <!-- Step 1 -->
      <g transform="translate(20, 80)">
        <text x="14" y="14" class="sans" font-size="12" font-weight="700" fill="#1c1917">1</text>
        <text x="70" y="14" class="mono" font-size="12" font-weight="700" fill="#d97706">0:00</text>
        <text x="170" y="14" class="mono" font-size="12" fill="#1c1917">+45g</text>
        <text x="280" y="14" class="mono" font-size="13" font-weight="700" fill="#059669">45g</text>
        <text x="400" y="14" class="sans" font-size="11" fill="#44403c">Gentle spiral saturation pour; swirl gently once for full wetting</text>
      </g>
      <line x1="20" y1="108" x2="804" y2="108" stroke="#f5f5f4" stroke-width="1"/>

      <!-- Step 2 -->
      <g transform="translate(20, 122)">
        <text x="14" y="14" class="sans" font-size="12" font-weight="700" fill="#1c1917">2</text>
        <text x="70" y="14" class="mono" font-size="12" font-weight="700" fill="#d97706">0:45</text>
        <text x="170" y="14" class="mono" font-size="12" fill="#1c1917">+95g</text>
        <text x="280" y="14" class="mono" font-size="13" font-weight="700" fill="#059669">140g</text>
        <text x="400" y="14" class="sans" font-size="11" fill="#44403c">Steady concentric circles from center out, maintaining low pour height</text>
      </g>
      <line x1="20" y1="150" x2="804" y2="150" stroke="#f5f5f4" stroke-width="1"/>

      <!-- Step 3 -->
      <g transform="translate(20, 164)">
        <text x="14" y="14" class="sans" font-size="12" font-weight="700" fill="#1c1917">3</text>
        <text x="70" y="14" class="mono" font-size="12" font-weight="700" fill="#d97706">1:30</text>
        <text x="170" y="14" class="mono" font-size="12" fill="#1c1917">+100g</text>
        <text x="280" y="14" class="mono" font-size="13" font-weight="700" fill="#059669">240g</text>
        <text x="400" y="14" class="sans" font-size="11" fill="#44403c">Center pulse pour to target 240g; allow complete drawdown by 2:45–3:00</text>
      </g>

      <g transform="translate(20, 196)">
        <rect width="784" height="26" rx="4" fill="#ecfdf5"/>
        <text x="14" y="17" class="sans" font-size="10" font-weight="700" fill="#047857">
          ✓ ARITHMETIC VERIFIED: Dose 15.0g × 16.0 Ratio = 240.0g Water | Sum of Pours (45 + 95 + 100) = 240.0g
        </text>
      </g>
    </g>

    <!-- Bottom Controls -->
    <g transform="translate(330, 526)">
      <rect width="260" height="38" rx="8" fill="#3c5438"/>
      <text x="130" y="24" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#ffffff">⏱️ Start Interactive Pour Timer</text>
    </g>
  </g>
</svg>

