<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="640" fill="#f5f5f4" rx="16"/>

  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Browser Window Chrome -->
    <rect width="920" height="580" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 908 0 C 914.627 0 920 5.373 920 12 L 920 44 L 0 44 Z" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>
    <rect x="220" y="10" width="480" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="460" y="26" text-anchor="middle" class="sans" font-size="11" fill="#78716c">https://brewwise.app/recipe/feedback</text>

    <!-- Header Section -->
    <g transform="translate(48, 64)">
      <text x="0" y="14" class="sans" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.8">POST-BREW SENSORY DIAL-IN</text>
      <text x="0" y="38" class="serif" font-size="22" font-weight="700" fill="#1c1917">Sensory Evaluation &amp; Barista Diagnosis</text>
      <text x="0" y="56" class="sans" font-size="12" fill="#78716c">Rate your cup below. Our deterministic diagnosis engine isolates and adjusts only 1–2 brewing variables.</text>
    </g>

    <!-- Sliders Card (Left Column) -->
    <g transform="translate(48, 140)">
      <rect width="400" height="400" rx="10" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>
      <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#1c1917">Cup Sensory Sliders</text>

      <!-- Sourness Slider -->
      <g transform="translate(20, 54)">
        <text x="0" y="12" class="sans" font-size="11" font-weight="600" fill="#44403c">Sourness / Acidity</text>
        <text x="360" y="12" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#ef4444">4 / 5 (Sharp)</text>
        <rect x="0" y="20" width="360" height="6" rx="3" fill="#e5e5e5"/>
        <rect x="0" y="20" width="288" height="6" rx="3" fill="#ef4444"/>
        <circle cx="288" cy="23" r="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      </g>

      <!-- Bitterness Slider -->
      <g transform="translate(20, 114)">
        <text x="0" y="12" class="sans" font-size="11" font-weight="600" fill="#44403c">Bitterness / Astringency</text>
        <text x="360" y="12" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#059669">2 / 5 (Low)</text>
        <rect x="0" y="20" width="360" height="6" rx="3" fill="#e5e5e5"/>
        <rect x="0" y="20" width="144" height="6" rx="3" fill="#059669"/>
        <circle cx="144" cy="23" r="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      </g>

      <!-- Sweetness Slider -->
      <g transform="translate(20, 174)">
        <text x="0" y="12" class="sans" font-size="11" font-weight="600" fill="#44403c">Sweetness Clarity</text>
        <text x="360" y="12" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#d97706">2 / 5 (Subdued)</text>
        <rect x="0" y="20" width="360" height="6" rx="3" fill="#e5e5e5"/>
        <rect x="0" y="20" width="144" height="6" rx="3" fill="#d97706"/>
        <circle cx="144" cy="23" r="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      </g>

      <!-- Body Slider -->
      <g transform="translate(20, 234)">
        <text x="0" y="12" class="sans" font-size="11" font-weight="600" fill="#44403c">Body &amp; Mouthfeel</text>
        <text x="360" y="12" text-anchor="end" class="sans" font-size="11" font-weight="700" fill="#78716c">3 / 5 (Medium)</text>
        <rect x="0" y="20" width="360" height="6" rx="3" fill="#e5e5e5"/>
        <rect x="0" y="20" width="216" height="6" rx="3" fill="#78716c"/>
        <circle cx="216" cy="23" r="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/>
      </g>

      <!-- Drawdown Speed Selector -->
      <g transform="translate(20, 294)">
        <text x="0" y="12" class="sans" font-size="11" font-weight="600" fill="#44403c">Drawdown Observation</text>
        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="112" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="56" y="19" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#b45309">⚡ Fast (2:15)</text>

          <rect x="124" y="0" width="112" height="30" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
          <text x="180" y="19" text-anchor="middle" class="sans" font-size="11" fill="#78716c">Normal (3:00)</text>

          <rect x="248" y="0" width="112" height="30" rx="6" fill="#ffffff" stroke="#d6d3d1" stroke-width="1"/>
          <text x="304" y="19" text-anchor="middle" class="sans" font-size="11" fill="#78716c">Stalled (&gt;3:45)</text>
        </g>
      </g>
    </g>

    <!-- Barista Diagnosis Card (Right Column) -->
    <g transform="translate(468, 140)">
      <rect width="404" height="400" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>

      <!-- Diagnosis Badge Header -->
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="170" height="26" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="85" y="17" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#dc2626">⚠️ DIAGNOSIS: UNDER-EXTRACTION</text>
        <text x="0" y="52" class="sans" font-size="16" font-weight="700" fill="#1c1917">Extraction Cut Short</text>
        <text x="0" y="74" class="sans" font-size="12" fill="#78716c">High sharp acidity and fast drawdown indicate water bypassed dense bean pores without dissolving sweetness.</text>
      </g>

      <!-- Target Adjustments for Next Attempt -->
      <g transform="translate(24, 134)">
        <rect width="356" height="84" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
        <text x="16" y="24" class="sans" font-size="11" font-weight="700" fill="#b45309">PRIMARY ADJUSTMENT (VARIABLE 1)</text>
        <text x="16" y="46" class="sans" font-size="14" font-weight="700" fill="#1c1917">Grind 1 click finer (21 clicks)</text>
        <text x="16" y="66" class="sans" font-size="11" fill="#92400e">Increases total contact surface area to extract deep sugars.</text>
      </g>

      <g transform="translate(24, 230)">
        <rect width="356" height="84" rx="8" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1"/>
        <text x="16" y="24" class="sans" font-size="11" font-weight="700" fill="#15803d">SECONDARY ADJUSTMENT (VARIABLE 2)</text>
        <text x="16" y="46" class="sans" font-size="14" font-weight="700" fill="#1c1917">Increase water temp: 93°C → 95°C</text>
        <text x="16" y="66" class="sans" font-size="11" fill="#166534">Hotter water increases extraction solubility for light-medium beans.</text>
      </g>

      <!-- Save & Iterate Button -->
      <g transform="translate(24, 334)">
        <rect width="356" height="42" rx="8" fill="#3c5438"/>
        <text x="178" y="26" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#ffffff">Apply Adjustments to Next Brew →</text>
      </g>
    </g>
  </g>
</svg>
