# Render Blueprint for BrewWise
# Deploy instantly by connecting your GitHub repo at https://dashboard.render.com/blueprints

services:
  # -------------------------------------------------------------
  # Backend: FastAPI REST API Engine
  # -------------------------------------------------------------
  - type: web
    name: brewwise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./brewwise.db
      - key: LIVE_DISCOVERY_ENABLED
        value: "true"
      - key: LIVE_DISCOVERY_RATE_LIMIT
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001

  # -------------------------------------------------------------
  # Frontend: React + Vite Single Page App
  # -------------------------------------------------------------
  - type: web
    name: brewwise-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: brewwise-backend
          property: host
